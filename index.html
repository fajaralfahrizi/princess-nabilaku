<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Untuk Nabila 🥺</title>
<style>
body {
  margin:0; 
  background: linear-gradient(to bottom, #0b1020 0%, #1a1f3a 50%, #2d1b69 100%);
  color:white; 
  font-family: Arial;
  text-align:center;
  min-height:100vh;
  position:relative;
  overflow:hidden;
}
/* BINTANG */
.stars {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background: radial-gradient(2px 2px at 20px 30px, #eee, transparent),
              radial-gradient(2px 2px at 40px 70px, #fff, transparent),
              radial-gradient(1px 1px at 90px 40px, #fff, transparent);
  background-size: 200px 200px;
  animation: twinkle 3s infinite;
}
@keyframes twinkle { 0%,100%{opacity:1} 50%{opacity:0.4} }

.content { position:relative; z-index:10; padding-top:15vh; }
.foto { width:150px; height:150px; border-radius:50%; border:3px solid white; box-shadow:0 0 20px pink; }
h1 { font-size:32px; font-style:italic; }
.btn { padding:12px 24px; margin:10px; border:2px solid white; background:transparent; color:white; border-radius:10px; font-size:18px; cursor:pointer; }
.btn:hover { background:white; color:black; }
.footer { position:absolute; bottom:20px; width:100%; font-size:12px; opacity:0.7; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="content">
  <img src="https://i.imgur.com/8Qf8yYQ.png" class="foto">
  <h1>Intinya,</h1>
  <p style="font-size:20px;">Kamu Mau Gak<br>Jadi Pacar Aku? 🥺❤️</p>
  <button class="btn">Mau</button>
  <button class="btn">Gamau</button>
</div>
<div class="footer">
  <span style="float:left; margin-left:20px;">Selasa, 18 Agustus 2026</span>
  <span style="float:right; margin-right:20px;">© feelthisray</span>
</div>
</body>
</html>
